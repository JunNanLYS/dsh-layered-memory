<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="modesTitle modesDesc">
  <title id="modesTitle">会话级记忆档位</title>
  <desc id="modesDesc">四个记忆档位：auto（默认，双族写入与召回）、chat（仅个人三类）、work（仅工作四类）、off（不写不召回，工具返回已隐身）。写入与召回始终同档。</desc>

  <rect width="1200" height="440" rx="26" fill="#0B0E14"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

    <!-- ── auto ── -->
    <g id="mode-auto">
      <rect x="46" y="64" width="262" height="264" rx="16" fill="#11161F" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="111" y="88" width="132" height="40" rx="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF"/>
      <text x="177" y="115" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="20" font-weight="700" fill="#2DD4BF">auto</text>
      <rect x="244" y="82" width="48" height="26" rx="13" fill="#2DD4BF"/>
      <text x="268" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0B0E14">默认</text>

      <circle cx="76" cy="152" r="4" fill="#2DD4BF"/>
      <text x="88" y="158" font-size="18" font-weight="700" fill="#C9CFDB">写入 · 蒸馏</text>
      <text x="88" y="188" font-size="18" fill="#8B93A7">双族七类单次抽取</text>
      <text x="88" y="212" font-size="18" fill="#8B93A7">type 前缀落族标签</text>

      <circle cx="76" cy="240" r="4" fill="#F5A623"/>
      <text x="88" y="246" font-size="18" font-weight="700" fill="#C9CFDB">召回 · 注入</text>
      <text x="88" y="276" font-size="18" fill="#8B93A7">双族全召回</text>
      <text x="88" y="300" font-size="18" fill="#8B93A7">分域 &lt;domain&gt; 注入</text>
    </g>

    <!-- ── chat ── -->
    <g id="mode-chat">
      <rect x="328" y="64" width="262" height="264" rx="16" fill="#11161F" stroke="#232A38" stroke-width="1.5"/>
      <rect x="393" y="88" width="132" height="40" rx="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF"/>
      <text x="459" y="115" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="20" font-weight="700" fill="#2DD4BF">chat</text>

      <circle cx="358" cy="152" r="4" fill="#2DD4BF"/>
      <text x="370" y="158" font-size="18" font-weight="700" fill="#C9CFDB">写入 · 蒸馏</text>
      <text x="370" y="188" font-size="18" fill="#8B93A7">仅个人三类</text>
      <text x="370" y="212" font-size="18" fill="#8B93A7">只入 chat 族</text>

      <circle cx="358" cy="240" r="4" fill="#F5A623"/>
      <text x="370" y="246" font-size="18" font-weight="700" fill="#C9CFDB">召回 · 注入</text>
      <text x="370" y="276" font-size="18" fill="#8B93A7">仅 chat 记忆+画像</text>
      <text x="370" y="300" font-size="18" fill="#8B93A7">chat 场景导航</text>
    </g>

    <!-- ── work ── -->
    <g id="mode-work">
      <rect x="610" y="64" width="262" height="264" rx="16" fill="#11161F" stroke="#232A38" stroke-width="1.5"/>
      <rect x="675" y="88" width="132" height="40" rx="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF"/>
      <text x="741" y="115" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="20" font-weight="700" fill="#2DD4BF">work</text>

      <circle cx="640" cy="152" r="4" fill="#2DD4BF"/>
      <text x="652" y="158" font-size="18" font-weight="700" fill="#C9CFDB">写入 · 蒸馏</text>
      <text x="652" y="188" font-size="18" fill="#8B93A7">仅工作四类</text>
      <text x="652" y="212" font-size="18" fill="#8B93A7">只入 work 族</text>

      <circle cx="640" cy="240" r="4" fill="#F5A623"/>
      <text x="652" y="246" font-size="18" font-weight="700" fill="#C9CFDB">召回 · 注入</text>
      <text x="652" y="276" font-size="18" fill="#8B93A7">仅 work 记忆+画像</text>
      <text x="652" y="300" font-size="18" fill="#8B93A7">work 场景导航</text>
    </g>

    <!-- ── off ── -->
    <g id="mode-off">
      <rect x="892" y="64" width="262" height="264" rx="16" fill="#11161F" stroke="#232A38" stroke-width="1.5"/>
      <rect x="957" y="88" width="132" height="40" rx="20" fill="#8B93A7" fill-opacity="0.12" stroke="#8B93A7"/>
      <text x="1023" y="115" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="20" font-weight="700" fill="#8B93A7">off</text>

      <circle cx="922" cy="152" r="4" fill="#8B93A7"/>
      <text x="934" y="158" font-size="18" font-weight="700" fill="#C9CFDB">写入 · 蒸馏</text>
      <text x="934" y="188" font-size="18" fill="#8B93A7">不写 L0</text>
      <text x="934" y="212" font-size="18" fill="#8B93A7">不蒸馏</text>

      <circle cx="922" cy="240" r="4" fill="#8B93A7"/>
      <text x="934" y="246" font-size="18" font-weight="700" fill="#C9CFDB">召回 · 注入</text>
      <text x="934" y="276" font-size="18" fill="#8B93A7">不召回</text>
      <text x="934" y="300" font-size="18" fill="#8B93A7">工具返回已隐身</text>
    </g>

    <!-- ── 底注 ── -->
    <rect x="46" y="360" width="1108" height="52" rx="12" fill="#0D1119" stroke="#232A38"/>
    <text x="600" y="392" text-anchor="middle" font-size="18" fill="#8B93A7">写入与召回同档 · 档位按 sessionId 持久化（session-modes.json）· 默认档 = config.family · 中途切档下一轮生效</text>
  </g>
</svg>
