# npm Trusted Publishing（OIDC）：push v* tag 自动发布，无需 token / 2FA。
# 前提（npmjs.com → dsh-layered-memory → Settings → Trusted Publisher）：
#   Repository: JunNanLYS/dsh-layered-memory，Workflow filename: publish.yml，
#   Allowed actions: npm publish（未配置前此工作流会在 publish 步骤鉴权失败）。
# 发版流程：改 package.json 版本 → 提交推送 → git tag vX.Y.Z && git push origin vX.Y.Z。
# npm 发布成功后自动创建 GitHub Release（正文取 CHANGELOG 对应版本小节，已存在则跳过）。
name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC 必需
  contents: write # 创建 GitHub Release 必需（其余步骤只读）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 自带 npm ≥ 11.5.1（OIDC 自动探测的最低要求），且满足 engines >=22.16
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      # 仅 tag 触发时校验（workflow_dispatch 手动试跑跳过：ref 是分支名，会走到 publish 鉴权一步）
      - name: 校验 tag 与版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 v$PKG_VERSION 不一致" >&2
            exit 1
          fi
      - run: npm publish
      # Release 正文 = CHANGELOG 的 [X.Y.Z] 小节（标题行剥除），标题 = 首行摘要；
      # 模式匹配含右中括号，0.7.1 不会误配 0.7.10 等更长版本号。
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过"
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md 未找到 [${VERSION}] 条目，无法生成 Release 笔记" >&2
            exit 1
          fi
          SUMMARY=$(awk 'NF { print; exit }' release_body.md | sed 's/[。]$//')
          DATE=$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md | sed -E 's/.*([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
          {
            cat release_body.md
            echo ""
            echo "**完整变更**: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md#$(printf '%s' "${VERSION}" | tr -d '.')--${DATE})"
          } > release_notes.md
          gh release create "${GITHUB_REF_NAME}" --title "v${VERSION} — ${SUMMARY}" --notes-file release_notes.md
