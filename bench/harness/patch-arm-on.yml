# A 组（记忆开）：记忆数据目录指向本次运行专属目录 + 蒸馏提速（缩短基准等待）。
# 模型钉死不在这里——settings.yaml 用户层会热替换默认模型，改由 runner 侧
# DSH_BENCH_PROVIDER / DSH_BENCH_MODEL 环境变量直接进 agentOptions（见 src/index.js）。
# dataDir 未设置时直接启动失败（防误写日常记忆库）。
- id: dsh-memory
  config:
    dataDir: !!js (() => { const v = process.env.DSH_BENCH_DATA_DIR; if (!v) throw new Error('A 组运行必须设置 DSH_BENCH_DATA_DIR'); return v; })()
    extract:
      minMessages: 1
      idleSeconds: 30
    # 蒸馏模型钉死：默认模型回落会命中 settings.yaml 的 deepseek-vision（bench profile 无此 adapter）。
    # 想省钱可换自有网关（my-ai-gateway/Auto-Free，定义于用户 settings.yaml 的 llm-pi-ai.providers，
    # 密钥走凭据服务解析），但免费档抖动大（实测流式空闲超时），正式基线建议用官方直连。
    llm:
      provider: deepseek-official
      model: deepseek-v4-flash
      reasoningEffort: "off"

# ---- 基准无工具面（两组共用，防 Agent 用 shell/文件工具翻记忆库作弊或被真实数据污染）----
# 只关面向模型的工具行；`tools` 运行时服务本身保留（dsh-layered-memory 硬依赖）。
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true

# 基准 persona：纯对话作答，禁工具，不知道就直说（答案变短也让关键词判分可靠）。
- id: system-prompt
  config:
    persona: >-
      You are a participant in a memory benchmark. Answer the user directly
      from the conversation context and your own memory only. Never use tools;
      never explore the file system. Keep answers short (1-3 sentences).
      If you don't know, say so plainly — never invent details.
